<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Timezone App</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>

<body>
  <main>
    <div class="topbar"><strong id="user-email">Signed in</strong>
      <div class="topbar-actions"><a href="/account">Account</a>
        <form method="post" action="/logout"><button type="submit">Log out</button></form>
      </div>
    </div>
    <section class="card">
      <h1>Timezone Calculator</h1>
      <h2>Your local time</h2>
      <div id="local-time" class="time">Loading…</div>
      <div id="timezone"></div>
    </section>
    <section class="card">
      <h2>Look up a ZIP code</h2>
      <form id="zip-form" class="row"><input id="zip" type="text" inputmode="numeric" pattern="\d{5}" maxlength="5"
          placeholder="84107" required><button type="submit">Look up</button></form>
      <pre id="result">No lookup yet.</pre>
    </section>
  </main>
  <script>const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; document.getElementById('timezone').textContent = `Timezone: ${tz}`; function tick() { document.getElementById('local-time').textContent = new Intl.DateTimeFormat(undefined, { dateStyle: 'full', timeStyle: 'medium' }).format(new Date()) } tick(); setInterval(tick, 1000); fetch('/me').then(r => r.json()).then(d => document.getElementById('user-email').textContent = d.email); document.getElementById('zip-form').addEventListener('submit', async e => { e.preventDefault(); const z = document.getElementById('zip').value.trim(), out = document.getElementById('result'); out.textContent = 'Loading…'; const r = await fetch(`/time/${encodeURIComponent(z)}`); out.textContent = JSON.stringify(await r.json(), null, 2) });</script>
</body>

</html>
