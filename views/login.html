<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Log in</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>
    <main>
        <section class="card auth-card">
            <h1>Log in</h1>
            <form method="post" action="/login"><label for="email">Email</label><input id="email" name="email"
                    type="email" required><label for="password">Password</label><input id="password" name="password"
                    type="password" required><button type="submit">Log in</button></form>
            <p>Need an account? <a href="/register">Sign up free</a>.</p>
        </section>
    </main>
</body>

</html>
