<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign up</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>
    <main>
        <section class="card auth-card">
            <h1>Create your free account</h1>
            <form method="post" action="/register"><label for="email">Email</label><input id="email" name="email"
                    type="email" required><label for="password">Password</label><input id="password" name="password"
                    type="password" minlength="8" required><button type="submit">Create account</button></form>
            <p>Already registered? <a href="/login">Log in</a>.</p>
        </section>
    </main>
</body>

</html>
