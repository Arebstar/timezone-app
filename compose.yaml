services:

  app:
    build: .
    container_name: timezone-app
    restart: unless-stopped

    environment:
      PORT: 3000
      DATABASE_URL: postgres://timezone:${DB_PASSWORD}@db:5432/timezone
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      SMTP_HOST: smtp.sendgrid.net
      SMTP_PORT: 587
      SMTP_USER: apikey
      SMTP_PASS: ${SENDGRID_API_KEY}
      MAIL_FROM: no-reply@workmansuccess.com
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID}

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend


  db:
    image: postgres:17-alpine
    container_name: timezone-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_DB: timezone
      POSTGRES_USER: timezone
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timezone -d timezone"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend


  mailpit:
    image: axllent/mailpit:latest
    container_name: timezone-mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"

    expose:
      - "1025"

    networks:
      - backend


volumes:
  postgres-data:


networks:
  backend:
